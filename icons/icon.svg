<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#232a55"/>
      <stop offset="1" stop-color="#0f1220"/>
    </linearGradient>
    <linearGradient id="ac" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#5cc8ff"/>
      <stop offset="1" stop-color="#7c5cff"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="110" fill="url(#bg)"/>
  <!-- botão superior do cronômetro -->
  <rect x="236" y="88" width="40" height="34" rx="10" fill="url(#ac)"/>
  <rect x="222" y="70" width="68" height="26" rx="13" fill="url(#ac)"/>
  <!-- corpo -->
  <circle cx="256" cy="290" r="150" fill="none" stroke="url(#ac)" stroke-width="26"/>
  <circle cx="256" cy="290" r="112" fill="#1e2340"/>
  <!-- ponteiro -->
  <line x1="256" y1="290" x2="256" y2="204" stroke="#eef0ff" stroke-width="18" stroke-linecap="round"/>
  <line x1="256" y1="290" x2="316" y2="330" stroke="#7c5cff" stroke-width="14" stroke-linecap="round"/>
  <circle cx="256" cy="290" r="16" fill="url(#ac)"/>
  <!-- venda nos olhos (cego) -->
  <rect x="150" y="238" width="212" height="34" rx="17" fill="#ffd166" opacity="0.92" transform="rotate(-8 256 255)"/>
</svg>
