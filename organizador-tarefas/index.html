<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
  <title>Minhas Tarefas</title>
  <meta name="description" content="Organizador pessoal de tarefas com voz e histórico">
  <meta name="theme-color" content="#1a1b2e">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="icon-180.png">
  <link rel="icon" type="image/png" href="icon-192.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Tarefas">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="topo">
    <h1 id="titulo-app">Minhas Tarefas</h1>
    <span id="contador" class="contador"></span>
  </header>

  <main>
    <!-- Aba: Tarefas pendentes -->
    <section id="painel-tarefas" class="painel ativo">
      <form id="form-nova" autocomplete="off">
        <div class="linha-entrada">
          <input type="text" id="entrada-tarefa" placeholder="O que você precisa fazer?"
                 enterkeyhint="done" maxlength="300">
          <button type="button" id="botao-voz" title="Ditar tarefa por voz" aria-label="Ditar por voz">
            <svg viewBox="0 0 24 24" width="22" height="22" fill="currentColor" aria-hidden="true">
              <path d="M12 14a3 3 0 0 0 3-3V5a3 3 0 0 0-6 0v6a3 3 0 0 0 3 3zm5-3a5 5 0 0 1-10 0H5a7 7 0 0 0 6 6.92V21h2v-3.08A7 7 0 0 0 19 11h-2z"/>
            </svg>
          </button>
          <button type="submit" id="botao-add" title="Adicionar tarefa" aria-label="Adicionar">
            <svg viewBox="0 0 24 24" width="22" height="22" fill="currentColor" aria-hidden="true">
              <path d="M19 13H13v6h-2v-6H5v-2h6V5h2v6h6z"/>
            </svg>
          </button>
        </div>
        <p id="status-voz" class="status-voz" hidden></p>
      </form>

      <ul id="lista-tarefas" class="lista"></ul>
      <p id="vazio-tarefas" class="vazio" hidden>
        Nenhuma tarefa pendente 🎉<br>
        <small>Adicione uma acima ou toque no microfone para ditar.</small>
      </p>
    </section>

    <!-- Aba: Histórico -->
    <section id="painel-historico" class="painel">
      <div id="conteudo-historico"></div>
      <p id="vazio-historico" class="vazio" hidden>
        Nada concluído ainda.<br>
        <small>Quando você marcar tarefas como feitas, elas aparecem aqui.</small>
      </p>
      <button id="botao-limpar" class="botao-limpar" hidden>Apagar todo o histórico</button>
    </section>
  </main>

  <nav class="abas" role="tablist">
    <button id="aba-tarefas" class="aba ativo" role="tab" aria-selected="true">
      <svg viewBox="0 0 24 24" width="24" height="24" fill="currentColor" aria-hidden="true">
        <path d="M19 3h-4.18C14.4 1.84 13.3 1 12 1s-2.4.84-2.82 2H5a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V5a2 2 0 0 0-2-2zm-7 0a1 1 0 1 1 0 2 1 1 0 0 1 0-2zm-2 14-4-4 1.41-1.41L10 14.17l6.59-6.59L18 9l-8 8z"/>
      </svg>
      <span>Tarefas</span>
    </button>
    <button id="aba-historico" class="aba" role="tab" aria-selected="false">
      <svg viewBox="0 0 24 24" width="24" height="24" fill="currentColor" aria-hidden="true">
        <path d="M13 3a9 9 0 0 0-9 9H1l3.89 3.89.07.14L9 12H6a7 7 0 1 1 2.05 4.95l-1.41 1.41A9 9 0 1 0 13 3zm-1 5v5l4.28 2.54.72-1.21-3.5-2.08V8H12z"/>
      </svg>
      <span>Histórico</span>
    </button>
  </nav>

  <script src="app.js"></script>
</body>
</html>
